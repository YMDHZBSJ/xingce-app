<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="tokens.css">
<style>
.kpcard{background:#fff;border-radius:18px;padding:14px;margin-bottom:10px;box-shadow:0 3px 14px rgba(233,69,96,.07)}
.kpcard .h{display:flex;justify-content:space-between;align-items:center}
.kpcard h4{margin:0;font-size:14.5px;font-weight:700}
.kpcard .n{font-size:11px;color:var(--brand-2);font-weight:800;background:var(--grad-soft);padding:3px 9px;border-radius:8px}
.chips2{display:flex;gap:7px;margin:9px 0 0}
.chips2 span{font-size:11px;padding:4px 9px;border-radius:8px;background:#F8F1EB;color:var(--fg-muted);font-weight:600}
.prog{height:4px;border-radius:2px;background:#F6EDE5;margin-top:10px;overflow:hidden}
.prog>i{display:block;height:100%;background:var(--grad)}
</style></head><body><div class="screen">
<div class="status"><span>9:41</span><span>考点图谱</span><span>100%</span></div>
<div class="scroll">
  <div class="h1">考点图谱</div>
  <div class="sub">106 个考点 · 双向关联</div>
  <div style="display:flex;gap:8px;margin-bottom:14px">
    <div class="pill on">全部</div><div class="pill">言语</div><div class="pill">判断</div><div class="pill">资料</div><div class="pill">数量</div>
  </div>

  <div class="kpcard">
    <div class="h"><h4>资料分析 · 增长率</h4><div class="n">1,842 题</div></div>
    <div class="chips2"><span>基期量</span><span>增长量</span><span>百分点</span><span>隔年增长</span></div>
    <div class="prog"><i style="width:68%"></i></div>
    <div class="muted" style="font-size:11px;margin-top:7px">我的正确率 68% · 关联 6 个考点</div>
  </div>

  <div class="kpcard">
    <div class="h"><h4>判断推理 · 图形推理</h4><div class="n">1,380 题</div></div>
    <div class="chips2"><span>位置规律</span><span>样式规律</span><span>数量规律</span><span>属性规律</span></div>
    <div class="prog"><i style="width:54%"></i></div>
    <div class="muted" style="font-size:11px;margin-top:7px">我的正确率 54% · 建议加强</div>
  </div>

  <div class="kpcard">
    <div class="h"><h4>言语理解 · 逻辑填空</h4><div class="n">2,104 题</div></div>
    <div class="chips2"><span>实词辨析</span><span>成语辨析</span><span>语境分析</span></div>
    <div class="prog"><i style="width:79%"></i></div>
    <div class="muted" style="font-size:11px;margin-top:7px">我的正确率 79% · 优势考点</div>
  </div>
</div>
<div class="tabbar">
  <div class="tab"><div class="ico">🏠</div>首页</div>
  <div class="tab on"><div class="ico">🔍</div>题库</div>
  <div class="tab"><div class="ico">✏️</div>专练</div>
  <div class="tab"><div class="ico">📝</div>模考</div>
  <div class="tab"><div class="ico">👤</div>我的</div>
</div>
</div></body></html>
