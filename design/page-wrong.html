<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="tokens.css">
<style>
.wcard{background:#fff;border-radius:18px;padding:14px;margin-bottom:10px;box-shadow:0 3px 14px rgba(233,69,96,.07)}
.wcard .h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.wcard .stem{font-size:13.5px;line-height:1.6;color:var(--fg-2)}
.wcard .acts{display:flex;gap:8px;margin-top:11px}
.wcard .acts div{font-size:12px;font-weight:700;padding:8px 14px;border-radius:10px}
.a1{background:var(--grad);color:#fff}
.a2{background:#F7F1EA;color:var(--fg-2)}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:6px 0 16px}
.stat div{background:#fff;border-radius:14px;padding:11px;text-align:center;box-shadow:0 3px 14px rgba(233,69,96,.07)}
.stat b{display:block;font-size:18px;font-weight:800}
.stat span{font-size:10.5px;color:var(--fg-muted)}
</style></head><body><div class="screen">
<div class="status"><span>9:41</span><span>错题本</span><span>100%</span></div>
<div class="scroll">
  <div class="h1">错题本</div>
  <div class="sub">共 89 道 · 按错误次数排序</div>
  <div class="stat">
    <div><b class="grad-text">89</b><span>待复习</span></div>
    <div><b>41</b><span>已掌握</span></div>
    <div><b>12</b><span>今日新增</span></div>
  </div>
  <div style="display:flex;gap:8px;margin-bottom:12px">
    <div class="pill on">全部</div><div class="pill">言语</div><div class="pill">判断</div><div class="pill">资料</div>
  </div>
  <div class="wcard">
    <div class="h"><span class="badge">错 3 次</span><span class="muted" style="font-size:11px">资料分析 · 2025 国考</span></div>
    <div class="stem">2024 年 1—11 月，我国集成电路布图设计登记发证量同比增速约为多少？</div>
    <div class="acts"><div class="a1">重做</div><div class="a2">掌握</div><div class="a2">移除</div></div>
  </div>
  <div class="wcard">
    <div class="h"><span class="badge">错 2 次</span><span class="muted" style="font-size:11px">判断推理 · 2024 江苏省考</span></div>
    <div class="stem">下列图形中，与其他三个规律不同的是（　）。</div>
    <div class="acts"><div class="a1">重做</div><div class="a2">掌握</div><div class="a2">移除</div></div>
  </div>
  <div class="wcard">
    <div class="h"><span class="badge">错 1 次</span><span class="muted" style="font-size:11px">言语理解 · 2023 国考</span></div>
    <div class="stem">基层治理是国家治理的基石，要推动基层治理重心向基层下移……</div>
    <div class="acts"><div class="a1">重做</div><div class="a2">掌握</div><div class="a2">移除</div></div>
  </div>
</div>
<div class="tabbar">
  <div class="tab"><div class="ico">🏠</div>首页</div>
  <div class="tab"><div class="ico">🔍</div>题库</div>
  <div class="tab"><div class="ico">✏️</div>专练</div>
  <div class="tab"><div class="ico">📝</div>模考</div>
  <div class="tab on"><div class="ico">👤</div>我的</div>
</div>
</div></body></html>
